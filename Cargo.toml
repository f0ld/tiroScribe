[workspace]
resolver = "2"
members = ["crates/scribe-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev.package."*"]
# Native inference code is unbearably slow without optimisation, even in dev builds.
opt-level = 3
