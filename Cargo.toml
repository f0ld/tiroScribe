[workspace]
resolver = "2"
members = ["crates/scribe-core", "src-tauri"]
exclude = ["vendor"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
# whisper.cpp aborts the whole app when DTW word timing meets a window that advanced
# 150 ms or less. Fixed upstream in median_filter, not yet in a whisper-rs-sys release;
# drop this once one ships the fix.
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.dev.package."*"]
# Native inference code is unbearably slow without optimisation, even in dev builds.
opt-level = 3
