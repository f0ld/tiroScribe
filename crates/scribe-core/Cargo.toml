[package]
name = "scribe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transcription, diarization and export pipeline for liveScribe"

[features]
default = ["vulkan"]
# GPU acceleration for Whisper via ggml's Vulkan backend (AMD, Intel, NVIDIA).
vulkan = ["whisper-rs/vulkan"]
# Headless command line front end (`scribe-cli`), handy for batch jobs and servers.
cli = ["dep:clap", "dep:env_logger"]

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"], optional = true }
dirs = "7.0"
env_logger = { version = "0.11", optional = true }
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
thiserror = "2.0"
ureq = { version = "3.5", features = ["json"] }
whisper-rs = { version = "0.16", features = ["log_backend"] }

[[bin]]
name = "scribe-cli"
required-features = ["cli"]
